name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q momentum-project.zip

      - name: Write signing key
        run: |
          echo "${{ secrets.MOMENTUM_KEYSTORE_B64 }}" | base64 -d > momentum/app/release.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: momentum
        env:
          MOMENTUM_STORE_PASSWORD: ${{ secrets.MOMENTUM_STORE_PASSWORD }}
          MOMENTUM_KEY_ALIAS: ${{ secrets.MOMENTUM_KEY_ALIAS }}
          MOMENTUM_KEY_PASSWORD: ${{ secrets.MOMENTUM_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp momentum/app/build/outputs/apk/debug/*.apk momentum-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: momentum-apk
          path: momentum-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Momentum 1.0.${{ github.run_number }}
          files: momentum-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
