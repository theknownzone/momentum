name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q momentum-project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: momentum
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp momentum/app/build/outputs/apk/debug/*.apk momentum-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: momentum-apk
          path: momentum-*.apk

      # Publishing a release is what makes the in-app updater work: release
      # assets are public, Actions artifacts are not.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Momentum 1.0.${{ github.run_number }}
          files: momentum-*.apk
          generate_release_notes: true
          # Without these the action leaves the release as a draft, which is
          # invisible to the public API the in-app updater reads.
          draft: false
          prerelease: false
          make_latest: true
