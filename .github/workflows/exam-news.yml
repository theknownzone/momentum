name: Exam news

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unpack project
        run: unzip -qo momentum-doubt-solver.zip

      - name: Seed feed from last commit
        run: |
          if [ -f exam-news.json ]; then
            cp exam-news.json momentum/exam-news.json
          fi

      - name: Fetch notices
        run: python3 momentum/tools/fetch_news.py

      - name: Publish feed to repo root
        run: cp momentum/exam-news.json exam-news.json

      - name: Commit if changed
        run: |
          if git diff --quiet exam-news.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "momentum-bot"
          git config user.email "bot@users.noreply.github.com"
          git add exam-news.json
          git commit -m "Exam news: $(date -u +%Y-%m-%d)"
          git push
